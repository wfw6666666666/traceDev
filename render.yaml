services:
  - type: web
    name: tracedev-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn tracedev_backend.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: tracedev-backend.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://tracedev-backend.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tracedev-db
          property: connectionString

databases:
  - name: tracedev-db
    plan: free
